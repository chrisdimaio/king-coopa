services:
  king-coopa-dashboard:
    build:
      context: .
      args:
        KC_RECONFIGURE_URL: ${KC_RECONFIGURE_URL:-http://fake-king-coopa.invalid:8080}
    image: king-coopa-dashboard
    container_name: king-coopa-dashboard
    ports:
      - "8090:8090"
    environment:
      # Set in a .env next to this file, or in Portainer's stack environment variables.
      KC_INFO_URL: ${KC_INFO_URL:?set KC_INFO_URL to the King Coopa API, e.g. http://<pi-address>:8080}
      # Open/close/restart. Empty = same as KC_INFO_URL (the real controller).
      KC_CONTROL_URL: ${KC_CONTROL_URL:-}
      # Reconfigure stays on a fake host unless KC_RECONFIGURE_URL is set.
      KC_RECONFIGURE_URL: ${KC_RECONFIGURE_URL:-http://fake-king-coopa.invalid:8080}
      # Coop camera: set to http://127.0.0.1:1984 and start with --profile camera.
      KC_GO2RTC_URL: ${KC_GO2RTC_URL:-}
      KC_AUDIO_SECONDS: ${KC_AUDIO_SECONDS:-300}
      # Pan/tilt (ONVIF) uses the same camera account; leave unset to hide the controls.
      KC_CAMERA_HOST: ${KC_CAMERA_HOST:-}
      TAPO_USER: ${TAPO_USER:-}
      TAPO_PASS: ${TAPO_PASS:-}
    restart: unless-stopped

  # Optional coop camera relay: docker compose --profile camera up -d --build
  go2rtc:
    profiles: ["camera"]
    image: alexxit/go2rtc:1.9.9
    container_name: king-coopa-go2rtc
    # Shares the dashboard's network namespace: go2rtc listens on 127.0.0.1 there and is never published.
    network_mode: "service:king-coopa-dashboard"
    depends_on:
      - king-coopa-dashboard
    environment:
      KC_CAMERA_HOST: ${KC_CAMERA_HOST:-}
      TAPO_USER: ${TAPO_USER:-}
      TAPO_PASS: ${TAPO_PASS:-}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    restart: unless-stopped
